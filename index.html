    <style>
        /* General body styling */
        body {
            background: #0;
            color: #cccccc;
            margin: 0;
            padding: 0;
            border: 0;
            display: flex;
            flex-direction: column; /* Stack elements vertically */
            height: 100vh;
        }

        /* Header Styling */
        header {
            background-color: #80b3f6;
            padding: 10px 20px;
            position: relative;
            z-index: 10; /* Ensure header stays on top */
            border-radius: 20px;
            border-style: solid;
            border-color:black;
            border-top-left-radius: 0px;
            border-top-right-radius: 0px;
        }

        /* Navbar container */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Main heading */
        .main-heading {
            font-size: 2rem;
            color: #2356da;
            font-family: verdana;
        }

        /* Navigation links styling */
        .nav-links {
            display: flex;
        }

        .nav-links li {
            margin: 0 15px;
        }

        /* Link styles */
        .nav-links a {
            color: rgb(0, 0, 0);
            font-size: 2rem;
            padding: 10px 15px;
            border-radius: 5px;
            transition: background-color 0.3s ease, color 0.3s ease;
            font-family: verdana;
        }

        /* Hover effect for the navigation links */
        .nav-links a:hover {
            background-color: #0754d0;
            color: #333;
        }

        /* Game canvas styling */
        canvas {
            width: 100%;
            height: 100%;
            margin-top: 20px; /* Add space below the header */
            display: block; /* Ensure canvas is displayed as block level element */
        }

        /* Ensure responsive design */
        @media (max-width: 768px) {
            .navbar {
                flex-direction: column;
                align-items: flex-start;
            }

            .nav-links {
                flex-direction: column;
                width: 100%;
            }

            .nav-links li {
                width: 100%;
                text-align: center;
            }

            .nav-links a {
                width: 100%;
                padding: 15px 0;
            }
        }

        /* Fullscreen style to hide navbar */
        .fullscreen .navbar {
            display: none;
        }
    </style>

    <script>
        function navigateToPage() {
            window.location.href = "https://nightlock100.github.io/notaustin/console.html"; // Replace with your desired URL
        }

        // Function to handle fullscreen toggle and navbar visibility
        function toggleFullscreen() {
            // Check if already in fullscreen mode
            if (!document.fullscreenElement && !document.webkitFullscreenElement && !document.mozFullScreenElement && !document.msFullscreenElement) {
                // Request fullscreen mode
                var elem = document.documentElement;
                if (elem.requestFullscreen) {
                    elem.requestFullscreen();
                } else if (elem.webkitRequestFullscreen) {
                    elem.webkitRequestFullscreen();
                } else if (elem.mozRequestFullScreen) {
                    elem.mozRequestFullScreen();
                } else if (elem.msRequestFullscreen) {
                    elem.msRequestFullscreen();
                }
            } else {
                // Exit fullscreen
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                } else if (document.mozCancelFullScreen) {
                    document.mozCancelFullScreen();
                } else if (document.msExitFullscreen) {
                    document.msExitFullscreen();
                }
            }
        }

        // Event listener to toggle fullscreen and hide navbar when fullscreen
        document.addEventListener('fullscreenchange', function() {
            if (document.fullscreenElement) {
                document.body.classList.add('fullscreen');
            } else {
                document.body.classList.remove('fullscreen');
            }
        });

        document.addEventListener('webkitfullscreenchange', function() {
            if (document.webkitFullscreenElement) {
                document.body.classList.add('fullscreen');
            } else {
                document.body.classList.remove('fullscreen');
            }
        });

        document.addEventListener('mozfullscreenchange', function() {
            if (document.mozFullScreenElement) {
                document.body.classList.add('fullscreen');
            } else {
                document.body.classList.remove('fullscreen');
            }
        });

        document.addEventListener('msfullscreenchange', function() {
            if (document.msFullscreenElement) {
                document.body.classList.add('fullscreen');
            } else {
                document.body.classList.remove('fullscreen');
            }
        });
    </script>

    <!-- Add button to toggle fullscreen -->
    <button onclick="toggleFullscreen()">Toggle Fullscreen</button>
