<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta http-equiv="pragma" content="no-cache"/>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name ="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta charset="utf-8"/>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <style>
        /* General body styling */
        body {
            background: #000;
            color: #cccccc;
            margin: 0;
            padding: 0;
            border: 0;
            display: flex;
            flex-direction: column; /* Stack elements vertically */
            height: 100vh;
            overflow-x: hidden; /* Prevent horizontal scroll */
            transition: padding-top 0.5s ease; /* Transition for sliding navbar */
        }

        /* Header Styling */
        header {
            background-color: #2356da;
            padding: 10px 20px;
            position: fixed;
            top: 0;
            left: 0;
            width: 96.5%;
            z-index: 10;
            border-radius: 20px;
            border-style: solid;
            border-color: black;
            border-top-left-radius: 0px;
            border-top-right-radius: 0px;
            height: 50px;
            transform: translateY(-100%); /* Initially hide the navbar off-screen */
            transition: transform 0.5s ease; /* Smooth transition */
        }

        /* Navbar container */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 100%;
        }

        /* Main heading */
        .main-heading {
            font-size: 2rem;
            color: #ffffff;
            font-family: 'Press Start 2P', cursive;
        }

        /* Navigation links styling */
        .nav-links {
            display: flex;
        }

        .nav-links li {
            margin: 0 15px;
        }

        /* Link styles */
        .nav-links a {
            color: rgb(255, 255, 255);
            font-size: 1.2rem;
            padding: 10px 15px;
            border-radius: 5px;
            transition: background-color 0.3s ease, color 0.3s ease;
            font-family: 'Press Start 2P', cursive;
        }

        /* Hover effect for the navigation links */
        .nav-links a:hover {
            background-color: #0754d0;
            color: #333;
        }

        /* Game canvas styling */
        /* Wrapper centers the game and fills the screen with black bars */
        #gm4html5_div_id {
            flex: 1 1 auto;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }

        /* Canvas always keeps a 16:9 ratio (640x360) and is as large as fits */
        canvas {
            --game-w: 16;
            --game-h: 9;
            width: min(100vw, calc(100vh * var(--game-w) / var(--game-h))) !important;
            height: min(100vh, calc(100vw * var(--game-h) / var(--game-w))) !important;
            aspect-ratio: 16 / 9;
            margin: 0 !important;
            display: block;
            flex: none;
            image-rendering: auto; /* canvas now renders at real screen resolution */
        }
        @supports (height: 100dvh) {
            canvas {
                width: min(100vw, calc(100dvh * var(--game-w) / var(--game-h))) !important;
                height: min(100dvh, calc(100vw * var(--game-h) / var(--game-w))) !important;
            }
        }

        /* Hide the entire top bar on phones / touch devices */
        @media (max-width: 768px), (hover: none) and (pointer: coarse) {
            header {
                display: none !important;
            }
        }

        /* Ensure responsive design */
        @media (max-width: 768px) {
            .navbar {
                flex-direction: column;
                align-items: flex-start;
            }

            .nav-links {
                flex-direction: column;
                width: 100%;
            }

            .nav-links li {
                width: 100%;
                text-align: center;
            }

            .nav-links a {
                width: 100%;
                padding: 15px 0;
            }
        }

        /* ===== Fullscreen button ===== */
        #rb-fs-btn {
            position: fixed;
            top: 8px;
            right: 8px;
            z-index: 20;
            width: 40px;
            height: 40px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.55);
            border: 2px solid #ffffff;
            border-radius: 6px;
            cursor: pointer;
            opacity: 0.55;
            transition: opacity 0.2s ease, top 0.5s ease, transform 0.1s ease;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
        }
        #rb-fs-btn:hover { opacity: 1; }
        #rb-fs-btn:active { transform: scale(0.92); }
        #rb-fs-btn svg { width: 22px; height: 22px; display: block; pointer-events: none; }
        /* Slide down out of the way while the Enter-key navbar is showing */
        #rb-fs-btn.navbar-open { top: 78px; }

        /* Fullscreen: fill the whole screen with the game */
        #gm4html5_div_id:fullscreen { width: 100vw; height: 100vh; background: #000; }
        #gm4html5_div_id:-webkit-full-screen { width: 100vw; height: 100vh; background: #000; }

        /* Fallback for browsers with no Fullscreen API (iPhone Safari) */
        #gm4html5_div_id.pseudo-fs {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            z-index: 9999;
            background: #000;
        }
        html.rb-pseudo-fs, html.rb-pseudo-fs body { overflow: hidden; }

        /* Navbar is completely hidden in fullscreen (real or fallback) */
        #gm4html5_div_id:fullscreen header,
        #gm4html5_div_id:-webkit-full-screen header,
        #gm4html5_div_id.pseudo-fs header {
            display: none !important;
        }
        /* Keep the fullscreen button in its normal spot too */
        #gm4html5_div_id:fullscreen #rb-fs-btn.navbar-open,
        #gm4html5_div_id:-webkit-full-screen #rb-fs-btn.navbar-open,
        #gm4html5_div_id.pseudo-fs #rb-fs-btn.navbar-open {
            top: 8px;
        }
    </style>

    <title>Home | Schoology</title>
    <link rel="icon" href="schoology.png" type="image/x-icon" />
</head>

    <script>
        // Handle Enter key press to toggle navbar visibility
        document.addEventListener('keydown', function(event) {
            if (event.key === "Enter") {
                // Never show the navbar on phones / touch devices
                if (window.matchMedia("(max-width: 768px), (hover: none) and (pointer: coarse)").matches) return;
                // Don't toggle the navbar while in fullscreen
                const inFs = document.fullscreenElement || document.webkitFullscreenElement ||
                    document.getElementById('gm4html5_div_id').classList.contains('pseudo-fs');
                if (inFs) return;
                // Toggle the navbar sliding in and out by changing its transform property
                const header = document.querySelector('header');
                if (header.style.transform === 'translateY(0px)') {
                    header.style.transform = 'translateY(-100%)'; // Hide the navbar
                    document.body.style.paddingTop = '0'; // Adjust body padding to compensate
                } else {
                    header.style.transform = 'translateY(0px)'; // Show the navbar
                    document.body.style.paddingTop = '50px'; // Adjust body padding when navbar is visible
                }
            }
        });

        document.addEventListener('keydown', function(event) {
  // Check if the key pressed is the "=" key
  if (event.key === "=") {
    // Prevent the default behavior
    event.preventDefault();

    // Open a new tab with the specific URL
    window.open("https://nightlock100.github.io/notaustin", '_blank');

    // Close the current tab
    window.close();
  }
});

    <!-- Fullscreen button (separate script block so the other scripts can't break it) -->
    <script>
    (function () {
        var root = document.getElementById('gm4html5_div_id');
        var header = document.querySelector('header');
        if (!root) return;

        var ICON_ENTER = '<svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="square"><path d="M3 9V3h6M21 9V3h-6M3 15v6h6M21 15v6h-6"/></svg>';
        var ICON_EXIT  = '<svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="square"><path d="M9 3v6H3M15 3v6h6M9 21v-6H3M15 21v-6h6"/></svg>';

        var btn = document.createElement('button');
        btn.id = 'rb-fs-btn';
        btn.type = 'button';
        btn.tabIndex = -1;            // so Enter/Space never "click" it by accident
        root.appendChild(btn);        // inside the root so it stays visible in fullscreen

        function fsElement() {
            return document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement || null;
        }
        function isPseudo() { return root.classList.contains('pseudo-fs'); }
        function isFull() { return fsElement() === root || isPseudo(); }

        // Tell the game the window size changed so it re-measures the canvas
        function nudge() {
            window.dispatchEvent(new Event('resize'));
            setTimeout(function () { window.dispatchEvent(new Event('resize')); }, 150);
        }

        function render() {
            var full = isFull();
            btn.innerHTML = full ? ICON_EXIT : ICON_ENTER;
            var label = full ? 'Exit fullscreen' : 'Fullscreen';
            btn.title = label;
            btn.setAttribute('aria-label', label);
        }

        function setPseudo(on) {
            root.classList.toggle('pseudo-fs', on);
            document.documentElement.classList.toggle('rb-pseudo-fs', on);
            render();
            nudge();
        }

        function enter() {
            var req = root.requestFullscreen || root.webkitRequestFullscreen || root.msRequestFullscreen;
            if (!req) { setPseudo(true); return; }
            try {
                var p = req.call(root, { navigationUI: 'hide' });
                if (p && p.catch) p.catch(function () { setPseudo(true); });
            } catch (e) {
                setPseudo(true);
            }
        }

        function exit() {
            if (isPseudo()) { setPseudo(false); return; }
            var ex = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
            if (ex) { try { ex.call(document); } catch (e) {} }
        }

        function toggle() { if (isFull()) { exit(); } else { enter(); } }

        // Keep presses on the button from also reaching the game as a click/tap
        ['mousedown', 'mouseup', 'pointerdown', 'pointerup', 'touchstart', 'touchend'].forEach(function (type) {
            btn.addEventListener(type, function (e) {
                e.stopPropagation();
                if (type === 'mousedown') e.preventDefault();   // don't steal keyboard focus from the game
            }, { passive: false });
        });
        btn.addEventListener('click', function (e) {
            e.preventDefault();
            e.stopPropagation();
            toggle();
            btn.blur();
        });

        ['fullscreenchange', 'webkitfullscreenchange', 'MSFullscreenChange'].forEach(function (type) {
            document.addEventListener(type, function () { render(); nudge(); });
        });

        // Esc already exits real fullscreen; handle it for the fallback mode too
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape' && isPseudo()) setPseudo(false);
        });

        // Slide the button below the navbar while the Enter-key navbar is open
        if (header && window.MutationObserver) {
            var sync = function () {
                btn.classList.toggle('navbar-open', header.style.transform === 'translateY(0px)');
            };
            new MutationObserver(sync).observe(header, { attributes: true, attributeFilter: ['style'] });
            sync();
        }

        render();
    })();
    </script>
