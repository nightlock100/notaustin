<!DOCTYPE html>
<html lang="en">
<head>
    <script src="/js/all.js"></script>
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta charset="utf-8" />
    <link rel="icon" href="download__12_-removebg-preview.png" type="image/x-icon" />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #007aff;
            border-style: solid;
            border-width: 5px;
            border-radius: 15px;
            border-color: #ffffff;
            font-family: 'Press Start 2P', cursive;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            min-height: 100vh;
            margin: 0;
            color: #ffffff;
        }
        h1 {
            font-size: 48px;
            text-transform: uppercase;
            text-align: center;
            letter-spacing: 5px;
            color: #ffffff;
            margin-bottom: 40px;
        }
        input, textarea {
            background-color: #222;
            border: 4px solid #ffffff;
            color: #ffffff;
            padding: 16px 30px;
            font-family: 'Press Start 2P', cursive;
            font-size: 18px;
            border-radius: 5px;
            width: 100%;
            box-sizing: border-box;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #00ff00;
        }
        button {
            background-color: #007aff;
            color: #ffffff;
            border: 4px solid #ffffff;
            padding: 16px 30px;
            font-size: 18px;
            text-align: center;
            cursor: pointer;
            border-radius: 8px;
            transition: background-color 0.3s ease, transform 0.2s ease;
            font-weight: bold;
            font-family: 'Press Start 2P', cursive;
            width: 600px;
            box-sizing: border-box;
            margin-top: 20px;
        }
        button:hover {
            background-color: #005cbf;
            transform: scale(1.05);
        }
        button:active {
            background-color: #003d7a;
            transform: scale(0.95);
        }
        .container {
            width: 90%;
            max-width: 600px;
            text-align: center;
        }

        label {margin: 12px;}
    </style>
    <title>Load Player Data</title>
</head>
<body>
    <h1>Player Loader</h1>
    <div class="container">
        <label for="playerNumber">Enter Player Number:</label>
        <input type="number" id="playerNumber" min="0">
        <button onclick="loadPlayer()">Load Player</button>
        <br><br>
        <textarea id="playerData" rows="10" cols="50" readonly></textarea>
    </div>
    <script>
        function loadPlayer() {
            let playerNumber = document.getElementById("playerNumber").value;
            let key = `roster_${playerNumber}`;
            let savedData = localStorage.getItem("RetroBowl.0.savedata.ini");
            
            if (savedData) {
                let lines = savedData.split('\n');
                let playerData = lines.find(line => line.startsWith(key));
                
                document.getElementById("playerData").value = playerData ? playerData : "Player not found.";
            } else {
                document.getElementById("playerData").value = "No saved data found.";
            }
        }
    </script>

<button onclick="navigateToPage()">BACK TO GAME</button>
<button onclick="navigateToConsole()">BACK TO CONSOLE</button>
    <script>
        function navigateToPage() {
            window.location.href = "index.html";
        }

        function navigateToConsole() {
            window.location.href = "console.html";
        }
    </script>
</body>
</html>
